- name: Create target directory
  file:
    path: app/code
    state: directory
    mode: 0755



- name: copy source
  synchronize:
    src: ../../../src/
    dest: app/code/src/
 
- name: copy pom
  synchronize:
    src: ../../../pom.xml
    dest: app/code/pom.xml

- name: build
  command: mvn install
  args:
    chdir: app/code/