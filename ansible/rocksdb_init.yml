---
- name: init rocksdb
  hosts: servers
  become: true

  vars:
    CHECKPOINT: "rocksdb/checkpoint"
    STORE_INITIALIZER: "app/InitStoreBenchmark.jar"
    TPCC_INITIALIZER: "app/InitTPCCBenchmark.java"
    HOTSPOTS: "rocksdb/hotspots"
    BENCHMARK: "tpcc"  # tpcc | store

  tasks:
    - name: Create target directory
      file:
        path: rocksdb
        state: directory
        mode: 0755

    - name: Run initializer
      command: "java -jar {{ STORE_INITIALIZER }} {{ CHECKPOINT }} {{HOTSPOTS}}"
      when: {{ BENCHMARK == 'store'}}

    - name: Run initializer
      command: "java -jar {{ TPCC_INITIALIZER }} {{ CHECKPOINT }} {{HOTSPOTS}}"
      when: {{ BENCHMARK == 'tpcc'}}



